# On-demand firmware build: pick a branch and a single project, run it from the Actions tab.
# Never triggers automatically (workflow_dispatch only) -- exists specifically so builds only
# consume free-plan Actions minutes when explicitly requested, unlike compile.yml (which auto-runs
# on every push to develop / PR to master and builds via tools/release/release.sh, ~11 project
# configs sequentially).

name: Manual firmware build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (or any git ref) to build'
        required: true
        default: 'develop'
        type: string
      project:
        description: 'Project under projects/ to build'
        required: true
        default: 'maixpy_k210'
        type: choice
        options:
          - maixpy_k210
          - maixpy_k210_minimum
          - maixpy_amigo_ips
          - maixpy_amigo_tft
          - maixpy_m5stickv
          - maixpy_twatch
      version_tag:
        description: 'Version tag to build with (local to this run only, never pushed -- the MaixPy IDE requires firmware >= 0.3.1 to connect at all; without any tag, git describe falls back to a bare hash and the build reports version 0.0.0)'
        required: true
        default: 'v0.6.4'
        type: string

jobs:
  build:
    name: build ${{ inputs.project }} @ ${{ inputs.branch }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # Firmware version (what the MaixPy IDE checks, minimum 0.3.1 to connect at all) comes from
      # git describe via tools/kconfig/update_build_info.py, run as a real build dependency for
      # every project (tools/cmake/compile.cmake:296-329). With no tag reachable, git describe falls
      # back to a bare commit hash, the version-parsing regex never matches, and the build silently
      # reports firmware version 0.0.0 -- which the IDE appears to treat as "not ready" and retries
      # against until it gives up with a timeout. This tag exists ONLY inside this run's own ephemeral
      # checkout and is never pushed anywhere, so it can't touch the real repo's tag history and can't
      # trigger publish.yml's `push: tags: [v*]` auto-build.
      - name: tag build version (local to this run only, never pushed)
        # Lightweight tag (no -a/-m) deliberately: an annotated tag creates a real git object with a
        # tagger identity, which a fresh runner has none of ("Committer identity unknown" / exit 128).
        # git describe's --tag flag (see update_build_info.py) already considers lightweight tags too.
        run: git tag ${{ inputs.version_tag }}

      # Deliberately not using checkout's own `submodules: recursive` option: it shallow-clones
      # submodules, and one nested submodule (lwip, pulled in by the micropython core submodule) is
      # hosted on git.savannah.gnu.org, which only supports "dumb" HTTP -- no shallow-clone support
      # at all, so that option fails outright. Plain `git submodule update` defaults to a full clone
      # per submodule, which dumb-HTTP can serve. Matches what compile.yml already does successfully.
      - name: checkout submodules
        run: git submodule update --init --recursive

      - name: install kendryte toolchain
        run: |
          wget https://github.com/kendryte/kendryte-gnu-toolchain/releases/download/v8.2.0-20190409/kendryte-toolchain-ubuntu-amd64-8.2.0-20190409.tar.xz
          sudo tar -Jxf kendryte-toolchain-ubuntu-amd64-8.2.0-20190409.tar.xz -C /opt
          rm -f kendryte-toolchain-ubuntu-amd64-8.2.0-20190409.tar.xz

      - name: build ${{ inputs.project }}
        run: |
          cd projects/${{ inputs.project }}
          python project.py distclean
          python project.py build

      # Makes the built firmware downloadable from the run's "Artifacts" section -- otherwise the
      # .bin/.elf only ever exist inside this ephemeral runner and are lost when the job ends.
      - name: upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-firmware-${{ inputs.branch }}-${{ github.sha }}
          path: |
            projects/${{ inputs.project }}/build/maixpy.bin
            projects/${{ inputs.project }}/build/maixpy.elf
          if-no-files-found: error
